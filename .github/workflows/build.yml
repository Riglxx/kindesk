name: Build KinDesk

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path kindesk.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name KinDesk --icon KinDesk.ico kindesk.py
          if (-not (Test-Path dist\KinDesk.exe)) { throw "KinDesk.exe not built" }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=${{ steps.ver.outputs.version }}" installer\KinDesk.iss

      - uses: actions/upload-artifact@v4
        with:
          name: KinDesk_v${{ steps.ver.outputs.version }}
          path: |
            dist/KinDesk.exe
            installer/Output/*.exe
